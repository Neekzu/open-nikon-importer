name: Build

on:
  push:
  pull_request:

jobs:
  swift-build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build --package-path App -c release --product ZRImporter

      - name: Package app bundle
        run: ./Scripts/package-app.sh

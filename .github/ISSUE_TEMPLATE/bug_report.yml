name: Bug report
description: Report a camera import or app bug.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "14.6.1"
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: Camera model and firmware
      placeholder: "Nikon ZR, firmware ..."
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: File types involved
      description: Extensions, approximate sizes, and whether proxies exist. Do not attach private media unless intentional.
      placeholder: ".NEV 9 GB with same-basename .MP4 proxy"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: App messages or logs
      render: text
